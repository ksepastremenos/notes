<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="Ubuntu, Arial, sans-serif">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="360" fill="#181a1b"/>

  <!-- left: small hole -->
  <g>
    <polygon points="40,160 360,148 360,172" fill="#5eedb8" fill-opacity="0.35"/>
    <line x1="40" y1="160" x2="360" y2="148" stroke="#5eedb8" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="360" y2="172" stroke="#5eedb8" stroke-width="1.5"/>
    <circle cx="40" cy="160" r="6" fill="#ffffff"/>
    <!-- wall with a small hole -->
    <line x1="200" y1="40" x2="200" y2="154" stroke="#ffffff" stroke-width="6"/>
    <line x1="200" y1="166" x2="200" y2="280" stroke="#ffffff" stroke-width="6"/>
    <!-- screen -->
    <line x1="360" y1="40" x2="360" y2="280" stroke="#cccccc" stroke-width="3"/>
    <line x1="360" y1="149" x2="360" y2="171" stroke="#5eedb8" stroke-width="10"/>
    <text x="200" y="320" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">μικρή τρύπα</text>
    <text x="200" y="346" fill="#cccccc" font-size="16" text-anchor="middle">μικρή κουκκίδα: καθαρή, σκοτεινή εικόνα</text>
  </g>

  <!-- right: large hole -->
  <g transform="translate(400 0)">
    <polygon points="40,160 360,80 360,240" fill="#5eedb8" fill-opacity="0.25"/>
    <line x1="40" y1="160" x2="360" y2="80" stroke="#5eedb8" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="360" y2="240" stroke="#5eedb8" stroke-width="1.5"/>
    <circle cx="40" cy="160" r="6" fill="#ffffff"/>
    <!-- wall with a large hole -->
    <line x1="200" y1="40" x2="200" y2="118" stroke="#ffffff" stroke-width="6"/>
    <line x1="200" y1="202" x2="200" y2="280" stroke="#ffffff" stroke-width="6"/>
    <!-- screen -->
    <line x1="360" y1="40" x2="360" y2="280" stroke="#cccccc" stroke-width="3"/>
    <rect x="353" y="86" width="14" height="148" rx="7" fill="#5eedb8" filter="url(#blur)"/>
    <text x="200" y="320" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">μεγάλη τρύπα</text>
    <text x="200" y="346" fill="#cccccc" font-size="16" text-anchor="middle">μεγάλος κύκλος: φωτεινή, θολή εικόνα</text>
  </g>

  <text x="40" y="30" fill="#cccccc" font-size="15">σημείο</text>
  <text x="200" y="30" fill="#cccccc" font-size="15" text-anchor="middle">τρύπα</text>
  <text x="360" y="30" fill="#cccccc" font-size="15" text-anchor="middle">πίσω τοίχος</text>
</svg>
